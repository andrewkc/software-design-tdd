services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: bodegas
      POSTGRES_USER: bodegas
      POSTGRES_PASSWORD: bodegas
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/002_cu03.sql:/docker-entrypoint-initdb.d/02-cu03.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bodegas -d bodegas"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
